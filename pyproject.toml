[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "college-finance-manager"
version = "0.4.4"
description = "实验室账本"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.9.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "PyInstaller==6.16.0",
]

[project.scripts]
college-finance-manager = "college_finance_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
college_finance_manager = ["infrastructure/migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
